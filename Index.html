<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quantum Breeze — العرض التقديمي | IECE 2026</title>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Tajawal','Cairo',Tahoma,sans-serif;
    background:#02060d; color:#e8f4ff;
  }

  /* ===== APP ===== */
  #app { display:flex; flex-direction:column; height:100vh; }

  /* ===== TOP BAR ===== */
  #topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px;
    background:linear-gradient(90deg,#050a14,#0a1628,#050a14);
    border-bottom:1px solid rgba(80,200,255,0.18);
    box-shadow:0 2px 20px rgba(0,100,200,0.15);
    z-index:100; flex-shrink:0;
  }
  #topbar .brand { display:flex; align-items:center; gap:12px; }
  #topbar .brand .logo {
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(135deg,#5ff2ff,#3aa8ff,#a06bff);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:16px; color:#031020;
    box-shadow:0 0 20px rgba(90,200,255,0.5);
  }
  #topbar .brand .txt h1 {
    font-size:14px; font-weight:800; letter-spacing:.4px;
    background:linear-gradient(90deg,#5ff2ff,#3aa8ff,#a06bff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #topbar .brand .txt p { font-size:10px; color:#6fa8c8; margin-top:1px; letter-spacing:.3px; }

  #topbar .toolbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

  .tb-btn {
    display:flex; align-items:center; gap:5px;
    padding:8px 13px; font-size:11.5px; font-weight:700; cursor:pointer;
    background:linear-gradient(160deg,rgba(20,50,80,0.85),rgba(10,25,45,0.85));
    border:1px solid rgba(80,200,255,0.28); border-radius:9px; color:#bfe6ff;
    transition:all .18s; font-family:inherit; white-space:nowrap;
    text-decoration:none;
  }
  .tb-btn:hover {
    background:linear-gradient(160deg,rgba(30,80,130,0.95),rgba(15,40,70,0.95));
    border-color:rgba(100,220,255,0.6); color:#fff; transform:translateY(-1px);
  }
  .tb-btn.primary { background:linear-gradient(160deg,#1c6fa8,#0d4570); border-color:#4fd0ff; color:#fff; }
  .tb-btn.primary:hover { background:linear-gradient(160deg,#2a8fd0,#0f5a94); }
  .tb-btn.success { background:linear-gradient(160deg,#1a8a5a,#0d5a3a); border-color:#4fffaa; color:#fff; }
  .tb-btn.danger { border-color:rgba(255,120,80,0.4); color:#ff9a70; }
  .tb-btn.danger:hover { background:linear-gradient(160deg,#8a2a1a,#5a1a10); border-color:#ff7a4c; color:#fff; }

  .status-dot { display:flex; align-items:center; gap:6px; font-size:11px; color:#5cffb0; padding:0 8px; }
  .status-dot .d {
    width:7px; height:7px; border-radius:50%; background:#5cffb0;
    box-shadow:0 0 8px #5cffb0; animation:pulse 1.8s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ===== STAGE ===== */
  #stage {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(50,120,200,0.14), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(120,60,180,0.1), transparent 55%),
      #02060d;
    position:relative; overflow:hidden;
  }
  #stage::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(80,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg,rgba(80,200,255,0.035) 1px, transparent 1px);
    background-size:44px 44px; pointer-events:none;
  }

  #slideWrap {
    position:relative;
    width:min(1280px,95vw);
    aspect-ratio:16/9;
    background:linear-gradient(140deg,#071220,#0a1c32 55%,#071220);
    border-radius:16px;
    box-shadow:
      0 30px 90px rgba(0,20,60,0.75),
      0 0 0 1px rgba(80,200,255,0.22),
      inset 0 0 90px rgba(0,80,160,0.12);
    overflow:hidden;
  }

  #slideContent {
    position:absolute; inset:0; padding:40px 55px;
    display:flex; flex-direction:column;
    color:#e8f4ff;
    overflow:hidden;
  }
  #slideContent .slide-num-badge {
    position:absolute; bottom:16px; left:28px;
    font-size:11px; color:#5a86a8; letter-spacing:1.5px; font-weight:700;
  }
  #slideContent .slide-brand {
    position:absolute; bottom:16px; right:28px;
    font-size:10.5px; color:#4a7ea0; letter-spacing:.6px;
    display:flex; align-items:center; gap:8px;
  }
  #slideContent .slide-brand::before {
    content:''; width:20px; height:1px; background:linear-gradient(90deg,transparent,#3aa8ff);
  }

  /* ===== SLIDE TYPOGRAPHY ===== */
  .sl-title {
    font-size:32px; font-weight:900; line-height:1.25;
    background:linear-gradient(90deg,#5ff2ff,#3aa8ff,#a06bff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px; letter-spacing:-0.3px;
  }
  .sl-subtitle {
    font-size:13.5px; color:#8ab6d4; line-height:1.55; margin-bottom:16px; font-weight:500;
  }
  .sl-divider {
    width:80px; height:3px; border-radius:2px;
    background:linear-gradient(90deg,#2aa8ff,#a06bff);
    margin-bottom:16px;
  }
  .sl-body { flex:1; display:flex; flex-direction:column; gap:10px; overflow:hidden; }

  /* ===== CARDS ===== */
  .card {
    background:linear-gradient(150deg,rgba(14,36,60,0.6),rgba(8,20,38,0.5));
    border:1px solid rgba(80,200,255,0.18);
    border-radius:12px; padding:14px 18px;
    transition:all .25s;
  }
  .card:hover {
    border-color:rgba(100,220,255,0.4);
    box-shadow:0 6px 24px rgba(0,80,160,0.2);
  }
  .card h3 {
    font-size:14px; font-weight:800; color:#7fe9ff; margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .card h3 .num {
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px;
    background:linear-gradient(135deg,#2aa8ff,#1a5a8a);
    color:#fff; font-size:11px; font-weight:900;
    box-shadow:0 0 12px rgba(80,200,255,0.5);
  }
  .card p { font-size:12.5px; line-height:1.7; color:#b0cbe0; }

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .grid-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:9px; }

  /* ===== METRICS ===== */
  .metric {
    background:linear-gradient(150deg,rgba(14,36,60,0.7),rgba(8,20,38,0.55));
    border:1px solid rgba(80,200,255,0.22);
    border-radius:11px; padding:14px 12px; text-align:center;
    position:relative; overflow:hidden; transition:all .25s;
  }
  .metric::after {
    content:''; position:absolute; top:0; right:0; left:0; height:3px;
    background:linear-gradient(90deg,#2aa8ff,#a06bff);
  }
  .metric:hover { transform:translateY(-2px); box-shadow:0 8px 26px rgba(0,90,180,0.28); }
  .metric .v {
    font-size:24px; font-weight:900; line-height:1.1;
    background:linear-gradient(90deg,#5ff2ff,#3aa8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .metric .l { font-size:10.5px; color:#8ab6d4; margin-top:5px; font-weight:600; line-height:1.35; }
  .metric.green::after { background:linear-gradient(90deg,#2ad8a0,#5cffb0); }
  .metric.green .v { background:linear-gradient(90deg,#5cffb0,#2ad8a0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .metric.purple::after { background:linear-gradient(90deg,#a06bff,#c48bff); }
  .metric.purple .v { background:linear-gradient(90deg,#c48bff,#a06bff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .metric.orange::after { background:linear-gradient(90deg,#ff7a3c,#ffb066); }
  .metric.orange .v { background:linear-gradient(90deg,#ffb066,#ff7a3c); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ===== LISTS ===== */
  .sl-list { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .sl-list li {
    display:flex; align-items:flex-start; gap:10px;
    font-size:12px; line-height:1.55; color:#c5ddef;
    padding:6px 10px; border-radius:8px;
    background:rgba(30,70,110,0.2);
    border-right:3px solid #2aa8ff;
  }
  .sl-list li .ic {
    flex-shrink:0; width:18px; height:18px; border-radius:5px;
    background:linear-gradient(135deg,#2aa8ff,#1a5a8a);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:900; color:#fff;
  }
  .sl-list.green li { border-right-color:#2ad8a0; }
  .sl-list.green li .ic { background:linear-gradient(135deg,#2ad8a0,#1a8a60); }
  .sl-list.purple li { border-right-color:#a06bff; }
  .sl-list.purple li .ic { background:linear-gradient(135deg,#a06bff,#6a3a9f); }
  .sl-list.orange li { border-right-color:#ff8a5c; }
  .sl-list.orange li .ic { background:linear-gradient(135deg,#ff8a5c,#c05a2a); }

  /* ===== TEAM CARDS ===== */
  .team-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; flex:1; }
  .team-card {
    background:linear-gradient(150deg,rgba(14,36,60,0.7),rgba(8,20,38,0.5));
    border:1px solid rgba(80,200,255,0.25);
    border-radius:14px; padding:18px;
    display:flex; flex-direction:column; gap:10px;
    position:relative; overflow:hidden;
  }
  .team-card::before {
    content:''; position:absolute; top:0; right:0; left:0; height:4px;
    background:linear-gradient(90deg,#2aa8ff,#a06bff);
  }
  .team-card .avatar {
    width:60px; height:60px; border-radius:14px;
    background:linear-gradient(135deg,#1a5a8a,#a06bff);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:900; color:#fff;
    box-shadow:0 0 24px rgba(80,200,255,0.4);
  }
  .team-card .name { font-size:17px; font-weight:800; color:#fff; line-height:1.3; }
  .team-card .role {
    display:inline-block; font-size:10.5px; font-weight:700;
    padding:3px 10px; border-radius:20px;
    background:rgba(80,200,255,0.15); color:#7fe9ff;
    border:1px solid rgba(80,200,255,0.35);
    margin-top:2px;
  }
  .team-card .info-list { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .team-card .info-item {
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; color:#b0cbe0;
  }
  .team-card .info-item .ic2 {
    width:22px; height:22px; border-radius:6px;
    background:rgba(80,200,255,0.12);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; flex-shrink:0;
  }

  /* ===== TABLES ===== */
  .sl-table { width:100%; border-collapse:separate; border-spacing:0 4px; font-size:11.5px; }
  .sl-table th {
    text-align:right; padding:8px 12px; font-weight:800; color:#7fe9ff;
    background:rgba(20,60,100,0.4); font-size:11px;
  }
  .sl-table th:first-child { border-radius:0 8px 8px 0; }
  .sl-table th:last-child { border-radius:8px 0 0 8px; }
  .sl-table td {
    padding:8px 12px; background:rgba(12,30,52,0.45);
    color:#c5ddef; font-weight:500;
  }
  .sl-table tr td:first-child {
    border-radius:0 8px 8px 0; border-right:3px solid #2aa8ff;
  }
  .sl-table tr td:last-child { border-radius:8px 0 0 8px; }
  .sl-table .good { color:#5cffb0; font-weight:700; }

  /* ===== NOTE BOX ===== */
  .note-box {
    background:linear-gradient(150deg,rgba(40,100,160,0.25),rgba(60,30,120,0.2));
    border:1px solid rgba(120,180,255,0.35);
    border-radius:10px; padding:12px 16px; margin-top:8px;
    font-size:11.5px; color:#c5e2f5; line-height:1.7;
  }
  .note-box strong { color:#7fe9ff; }

  /* ===== NAVBAR ===== */
  #navbar {
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:10px; background:linear-gradient(90deg,#050a14,#0a1628,#050a14);
    border-top:1px solid rgba(80,200,255,0.18);
    flex-shrink:0;
  }

  .nav-btn {
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,rgba(20,50,80,0.85),rgba(10,25,45,0.85));
    border:1px solid rgba(80,200,255,0.28); color:#bfe6ff;
    cursor:pointer; transition:all .18s; font-size:15px;
  }
  .nav-btn:hover { background:linear-gradient(160deg,rgba(30,80,130,0.95),rgba(15,40,70,0.95)); color:#fff; border-color:rgba(100,220,255,0.6); }
  .nav-btn:disabled { opacity:0.3; cursor:not-allowed; }

  #slideIndicator {
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:#8ab6d4; font-weight:600;
    min-width:100px; justify-content:center;
  }
  #slideIndicator .cur { color:#7fe9ff; font-weight:800; font-size:14px; }

  /* ===== SIDEBAR ===== */
  #sidebar {
    position:fixed; top:0; right:0; bottom:0; width:240px;
    background:linear-gradient(180deg,#04080f,#0a1424);
    border-left:1px solid rgba(80,200,255,0.2);
    z-index:200; transform:translateX(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
    box-shadow:-10px 0 40px rgba(0,0,0,0.5);
  }
  #sidebar.open { transform:translateX(0); }
  #sidebar .sb-head {
    padding:14px 16px; border-bottom:1px solid rgba(80,200,255,0.15);
    display:flex; align-items:center; justify-content:space-between;
  }
  #sidebar .sb-head h3 { font-size:12px; color:#7fe9ff; letter-spacing:1px; text-transform:uppercase; }
  #sidebar .sb-close {
    width:26px; height:26px; border-radius:7px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.05); color:#8ab6d4; font-size:14px;
  }
  #sidebar .sb-close:hover { background:rgba(255,120,80,0.2); color:#ff9a70; }

  #sbList { flex:1; overflow-y:auto; padding:10px; }
  #sbList::-webkit-scrollbar { width:5px; }
  #sbList::-webkit-scrollbar-thumb { background:rgba(80,200,255,0.3); border-radius:3px; }

  .sb-item {
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:9px; cursor:pointer;
    margin-bottom:5px; transition:all .18s;
    border:1px solid transparent;
  }
  .sb-item:hover { background:rgba(80,200,255,0.08); }
  .sb-item.active {
    background:rgba(80,200,255,0.14);
    border-color:rgba(80,200,255,0.4);
    box-shadow:0 0 14px rgba(80,200,255,0.2);
  }
  .sb-item .num {
    flex-shrink:0; width:24px; height:24px; border-radius:6px;
    background:rgba(80,200,255,0.15); color:#7fe9ff;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800;
  }
  .sb-item.active .num { background:linear-gradient(135deg,#2aa8ff,#1a5a8a); color:#fff; }
  .sb-item .t { font-size:11.5px; color:#b0cbe0; font-weight:600; line-height:1.3; }
  .sb-item.active .t { color:#fff; }

  /* ===== EDIT MODE ===== */
  [contenteditable="true"] { outline:none; border-radius:5px; transition:all .15s; }
  body.editing [contenteditable="true"]:hover {
    background:rgba(80,200,255,0.06);
    box-shadow:inset 0 0 0 1px rgba(80,200,255,0.25);
  }
  body.editing [contenteditable="true"]:focus {
    background:rgba(80,200,255,0.09);
    box-shadow:inset 0 0 0 2px rgba(80,200,255,0.55);
  }
  body:not(.editing) [contenteditable="true"] { cursor:default; }

  #editModeBadge {
    position:fixed; top:76px; right:20px;
    padding:6px 14px; border-radius:20px;
    background:linear-gradient(135deg,#ff8a3c,#c04a1a);
    color:#fff; font-size:11px; font-weight:800;
    box-shadow:0 4px 18px rgba(255,120,60,0.5);
    z-index:150; display:none; align-items:center; gap:7px;
  }
  #editModeBadge::before {
    content:''; width:7px; height:7px; border-radius:50%; background:#fff;
    animation:pulse 1.2s infinite;
  }
  body.editing #editModeBadge { display:flex; }

  /* ===== TOAST ===== */
  #toast {
    position:fixed; bottom:80px; left:50%; transform:translate(-50%,20px);
    padding:12px 26px; font-size:13px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,rgba(20,60,100,0.96),rgba(10,35,65,0.96));
    border:1px solid rgba(80,200,255,0.5);
    border-radius:12px; opacity:0; transition:all .35s; pointer-events:none;
    box-shadow:0 10px 40px rgba(0,80,180,0.4);
    z-index:500; letter-spacing:.3px;
  }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #toast.success { border-color:rgba(92,255,176,0.6); }
  #toast.error { border-color:rgba(255,120,80,0.6); }

  /* ===== PROGRESS ===== */
  #progressBar {
    position:absolute; top:0; left:0; right:0; height:2px;
    background:rgba(80,200,255,0.1); z-index:2;
  }
  #progressBar .fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#2aa8ff,#a06bff,#5ff2ff);
    transition:width .4s ease;
    box-shadow:0 0 10px rgba(80,200,255,0.6);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1100px) {
    #slideContent { padding:28px 34px; }
    .sl-title { font-size:26px; }
    .grid-5 { grid-template-columns:repeat(3,1fr); }
  }
  @media (max-width: 800px) {
    .grid-3,.grid-4,.grid-5 { grid-template-columns:1fr 1fr; }
    .team-grid { grid-template-columns:1fr; }
    #slideContent { padding:22px 24px; }
    .sl-title { font-size:20px; }
    .sl-subtitle { font-size:11px; }
    .metric .v { font-size:18px; }
    .tb-btn { padding:6px 10px; font-size:10.5px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ===== TOP BAR ===== -->
  <div id="topbar">
    <div class="brand">
      <div class="logo">Q</div>
      <div class="txt">
        <h1>QUANTUM BREEZE — عرض المشروع</h1>
        <p>الهيئة السعودية للمهندسين · IECE 2026 · مسار البناء الذكي منخفض التكلفة</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="status-dot" id="saveStatus">
        <span class="d"></span><span id="saveStatusText">تم الحفظ</span>
      </div>
      <button class="tb-btn" id="btnSidebar" title="عرض الشرائح">☰ الشرائح</button>
      <button class="tb-btn" id="btnEdit" title="تحرير المحتوى">✎ تحرير</button>
      <button class="tb-btn" id="btnLoadJSON" title="استيراد مشروع">⬆ استيراد</button>
      <button class="tb-btn" id="btnSaveJSON" title="حفظ نسخة">⬇ حفظ نسخة</button>
      <button class="tb-btn danger" id="btnReset" title="استعادة الأصل">⟲ استعادة</button>
      <button class="tb-btn primary" id="btnPDF" title="تصدير PDF">📄 PDF</button>
      <button class="tb-btn success" id="btnPPTX" title="تصدير PowerPoint">📊 PowerPoint</button>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none" />
  </div>

  <!-- ===== SLIDE STAGE ===== -->
  <div id="stage">
    <div id="slideWrap">
      <div id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div id="slideContent"></div>
    </div>
  </div>

  <!-- ===== NAV BAR ===== -->
  <div id="navbar">
    <button class="nav-btn" id="navFirst" title="الأولى">⏮</button>
    <button class="nav-btn" id="navPrev" title="السابقة">◀</button>
    <div id="slideIndicator">
      <span class="cur" id="curNum">1</span>
      <span>/</span>

/* ================================================================
   STATE + PERSISTENCE
   ================================================================ */
const STORAGE_KEY = 'quantum_breeze_pitch_v1';
['quantum_breeze_pitch_v0'].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });

let DATA = { slides: DEFAULT_DATA.slides.map(s => Object.assign({}, s)) };
let currentSlide = 0;
let editing = false;
let SLIDE_HTML = {};

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.edits && typeof parsed.edits === 'object') {
      Object.keys(parsed.edits).forEach(key => {
        const val = parsed.edits[key];
        if (typeof val === 'string' && val.trim().length > 120 && !val.includes('Slide render error')) {
          SLIDE_HTML[key] = val;
        }
      });
    }
    if (typeof parsed.currentSlide === 'number') {
      currentSlide = Math.max(0, Math.min(DATA.slides.length - 1, parsed.currentSlide));
    }
  } catch(e) { console.warn('load failed', e); }
}

function saveToStorage() {
  try {
    const payload = { edits: SLIDE_HTML, currentSlide, savedAt: Date.now() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    flashSaved();
  } catch(e) { console.warn('save failed', e); }
}

function flashSaved() {
  const el = document.getElementById('saveStatusText');
  if (!el) return;
  el.textContent = 'تم الحفظ';
  clearTimeout(flashSaved._h);
  flashSaved._h = setTimeout(() => { el.textContent = 'تم الحفظ'; }, 900);
}

/* ================================================================
   RENDER
   ================================================================ */
function renderSlide() {
  const slide = DATA.slides[currentSlide];
  const el = document.getElementById('slideContent');
  if (!slide || !el) return;

  try {
    if (SLIDE_HTML[slide.id]) {
      el.innerHTML = SLIDE_HTML[slide.id];
    } else {
      el.innerHTML = typeof slide.render === 'function' ? slide.render() : '';
    }
  } catch(err) {
    console.error('Slide render error:', err);
    el.innerHTML = `<h2 class="sl-title">خطأ في العرض: ${err.message}</h2>`;
  }

  // Badge + Brand
  const numBadge = document.createElement('div');
  numBadge.className = 'slide-num-badge';
  numBadge.textContent = String(currentSlide + 1).padStart(2,'0') + ' / ' + String(DATA.slides.length).padStart(2,'0');
  el.appendChild(numBadge);

  const brand = document.createElement('div');
  brand.className = 'slide-brand';
  brand.textContent = 'QUANTUM BREEZE';
  el.appendChild(brand);

  // Editable state
  el.querySelectorAll('[contenteditable]').forEach(e => {
    e.setAttribute('contenteditable', editing ? 'true' : 'false');
  });

  // Progress
  const pf = document.getElementById('progressFill');
  if (pf) pf.style.width = ((currentSlide + 1) / DATA.slides.length * 100) + '%';

  // Nav
  document.getElementById('curNum').textContent = currentSlide + 1;
  document.getElementById('totalNum').textContent = DATA.slides.length;
  document.getElementById('navFirst').disabled = currentSlide === 0;
  document.getElementById('navPrev').disabled = currentSlide === 0;
  document.getElementById('navNext').disabled = currentSlide === DATA.slides.length - 1;
  document.getElementById('navLast').disabled = currentSlide === DATA.slides.length - 1;

  // Sidebar active
  document.querySelectorAll('.sb-item').forEach((it, i) => {
    it.classList.toggle('active', i === currentSlide);
  });

  // Fade
  el.style.animation = 'none';
  void el.offsetHeight;
  el.style.animation = 'slideFadeIn .45s ease';
}

function buildSidebar() {
  const list = document.getElementById('sbList');
  list.innerHTML = '';
  DATA.slides.forEach((s, i) => {
    const it = document.createElement('div');
    it.className = 'sb-item' + (i === currentSlide ? ' active' : '');
    it.innerHTML = `<div class="num">${String(i+1).padStart(2,'0')}</div><div class="t">${s.title}</div>`;
    it.onclick = () => { goToSlide(i); closeSidebar(); };
    list.appendChild(it);
  });
}

/* ================================================================
   NAVIGATION
   ================================================================ */
function captureCurrentSlideEdits() {
  if (!editing) return;
  const slide = DATA.slides[currentSlide];
  const el = document.getElementById('slideContent');
  if (el && slide) {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('.slide-num-badge, .slide-brand').forEach(n => n.remove());
    const html = clone.innerHTML;
    if (html && html.trim().length > 120) SLIDE_HTML[slide.id] = html;
  }
}

function goToSlide(i) {
  captureCurrentSlideEdits();
  saveToStorage();
  currentSlide = Math.max(0, Math.min(DATA.slides.length - 1, i));
  renderSlide();
  buildSidebar();
}

function nextSlide() { goToSlide(currentSlide + 1); }
function prevSlide() { goToSlide(currentSlide - 1); }

document.getElementById('navFirst').onclick = () => goToSlide(0);
document.getElementById('navPrev').onclick = prevSlide;
document.getElementById('navNext').onclick = nextSlide;
document.getElementById('navLast').onclick = () => goToSlide(DATA.slides.length - 1);

document.addEventListener('keydown', (e) => {
  if (editing && e.target.matches('[contenteditable="true"]')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); prevSlide(); }
  if (e.key === 'Home') goToSlide(0);
  if (e.key === 'End') goToSlide(DATA.slides.length - 1);
  if (e.key === 'F5') { e.preventDefault(); enterEditMode(); }
  if (e.key === 'Escape' && editing) exitEditMode();
});

  document.body.classList.remove('editing');

  document.getElementById('btnEdit').textContent = '✎ تحرير';

  renderSlide();
  toast('تم حفظ التعديلات', 'success');
}
document.getElementById('btnEdit').onclick = () => {

};

document.getElementById('btnSaveJSON').onclick = () => {

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Quantum_Breeze_Pitch_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('تم حفظ النسخة', 'success');
};

document.getElementById('btnLoadJSON').onclick = () => { document.getElementById('fileInput').click(); };
document.getElementById('fileInput').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.edits) {
        SLIDE_HTML = parsed.edits;
        saveToStorage();
        renderSlide();
        toast('تم تحميل المشروع بنجاح', 'success');
      }
    } catch(err) { toast('ملف غير صالح', 'error'); }
  };
  reader.readAsText(f);
};

/* ================================================================
   TOAST
   ================================================================ */
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = '';
  if (type) t.classList.add(type);
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 2600);
}
